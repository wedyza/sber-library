version: "1.0"
services:
  db:
    image: postgres:14
    container_name: library_db
    restart: always
    env_file: ./.env
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:  
    image: minio/minio
    container_name: library_minio
    restart: unless-stopped  
    ports:
      - 9000:9000
      - 9001:9001
    expose:
      - "9000"
    volumes:  
      - minio-storage:/data  
    environment:  
      - MINIO_ROOT_USER=miniouser  
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"  
    healthcheck:  
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]  
      interval: 30s  
      timeout: 20s  
      retries: 3
    # profiles: [donotstart]

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: library_rabbitmq
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:15672"]
        interval: 30s
        timeout: 10s
        retries: 5
    # profiles: [donotstart]

  elasticsearch:
    image: elasticsearch:8.17.10
    container_name: library_elasticsearch
    ports:
      - 9200:9200
      - 9300:9300
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=MyPassword
    # profiles: [donotstart]

  nginx:
    build: ./nginx
    container_name: library_nginx
    ports:
      - 8080:80
    depends_on:
      - web_app
    volumes:
      - static:/static/
    # profiles: [donotstart]
  
  web_app:
    build: ./library
    container_name: web_app
    depends_on:
      - db
    environment:
      - CONTAINER_LAUNCH=1
    volumes:
      - static:/static/


  celery:
    build: ./library
    container_name: celery_worker_main_app
    depends_on:
      - web_app
      - rabbitmq
    environment:
      - CONTAINER_LAUNCH=1
    volumes:
      - static:/static/
    command: celery -A library worker -l INFO
    # profiles: [donotstart]
  

volumes:
 pg_data:
 minio-storage:
 static: